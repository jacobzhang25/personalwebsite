# Netlify build config.
# If you deploy elsewhere (Vercel, Cloudflare Pages), you can delete this file;
# most providers auto-detect Astro.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Pretty URLs: trailing slash is handled by Astro's default output.
# Redirect trailing-slash variants to canonical.
[[redirects]]
  from = "/blog/"
  to = "/blog"
  status = 301
  force = true
